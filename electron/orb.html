<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Kulka głosowa</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      body > button { position: absolute; top: var(--orb-button-top); left: var(--orb-button-left); }
      #voice-mode {
        position: absolute; bottom: -2px; right: -7px; z-index: 1;
        font: 600 9px/12px 'Segoe UI', system-ui, sans-serif;
        opacity: .9; pointer-events: none;
      }
      #voice-mode span { color: #eee9e2; background: #302d29b3; text-shadow: 0 1px 2px #000; border-radius: 3px; padding: 1px 3px; text-box: trim-both cap alphabetic; }
      button { position: relative; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; place-items: center; width: var(--orb-button-size); height: var(--orb-button-size); border-radius: 50%; }
      button:focus-visible { outline: 2px solid #2457d6; }
      button[data-state="error"] { outline: 2px solid #a12932; }
      button:is([data-state="thinking"], [data-state="transcribing"], [data-state="starting"], [data-state="preparing-speech"])::after {
        content: ''; position: absolute; inset: -2px; pointer-events: none;
        border: 2px solid #2457d640; border-top-color: #2457d6; border-right-color: #2457d6;
        border-radius: 50%; animation: wait-spin 1s linear infinite;
      }
      button:is([data-state="thinking"], [data-state="preparing-speech"])::after {
        animation-direction: reverse; animation-duration: .5s;
      }
      button[data-paused]::after { animation-play-state: paused; }
      body:not([data-presence="visible"]) button::after { visibility: hidden; }
      @keyframes wait-spin { to { transform: rotate(360deg); } }
      voice-orb {
        --orb-size: 45px;
        opacity: 0; transform: translateY(10px) scale(.72);
        transition: opacity 320ms ease, transform 380ms cubic-bezier(.2, .7, .25, 1);
      }
      body[data-presence="visible"] voice-orb { opacity: .9; transform: translateY(0) scale(1); }
      body[data-presence="visible"] button:is(:hover, :focus-visible) voice-orb { opacity: 1; }
      body[data-presence="leaving"] voice-orb, body[data-presence="hidden"] voice-orb {
        opacity: 0; transform: translateY(12px) scale(.72); transition-duration: 240ms;
      }
      @media (prefers-reduced-motion: reduce) {
        voice-orb { transition: none; transform: none !important; }
        button::after { animation: none !important; }
      }
    </style>
    <script src="./orb-geometry.cjs"></script>
    <script type="module" src="./orb-ui.js"></script>
  </head>
  <body><button type="button" aria-label="Otwórz rozmowę"><voice-orb state="idle"><span id="voice-mode" slot="overlay" aria-hidden="true" hidden><span></span></span></voice-orb></button></body>
</html>
