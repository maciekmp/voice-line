<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Voice Line — rozmowa</title>
<link rel="stylesheet" href="conversation.css">
<script type="module" src="conversation.js"></script>
</head>
<body data-mode="peek">
<button id="previous" class="popup-action" type="button" aria-label="Wróć do poprzedniej rozmowy" title="Brak poprzedniej rozmowy" disabled>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9a9 9 0 0 0-6 2.3L3 13"/></g></svg>
</button>
<button id="pin" class="popup-action" type="button" aria-label="Przypnij popup" aria-pressed="false" title="Przypnij popup">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4a1 1 0 0 1 1 1z"/></svg>
</button>
<main>
<section id="history" aria-label="Poprzednie wiadomości" hidden></section>
<section id="transcript" aria-label="Ostatnie pytanie i odpowiedź" tabindex="0">
<p id="empty">Przytrzymaj Copilot, aby zapytać.</p>
<article id="question-block" aria-label="Twoje pytanie" hidden><p id="question"></p></article>
<article id="answer-block" aria-label="Odpowiedź" hidden><div id="answer"></div></article>
</section>
<p id="status" role="status" hidden></p>
<p id="error" role="alert" hidden></p>
<button id="retry" type="button" hidden>Spróbuj ponownie</button>
</main>
<form id="composer" novalidate hidden>
<label class="sr-only" for="message">Kontynuuj rozmowę</label>
<textarea id="message" rows="1" maxlength="12000" placeholder="Napisz wiadomość…" enterkeyhint="send" aria-describedby="message-help status error"></textarea>
<span id="message-help" class="sr-only">Enter wysyła wiadomość. Shift+Enter dodaje nową linię.</span>
</form>
</body>
</html>
