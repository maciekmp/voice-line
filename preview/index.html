<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Niebieska kulka — podgląd</title>
    <style>
      :root {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #f0f0f0; background: #000;
        --muted: #a9a9b2; --accent: #b6c3ff;
        --scroll-thumb: #666674; --scroll-track: #000; --scroll-hover: #9292a4;
      }
      * { box-sizing: border-box; scrollbar-color: var(--scroll-thumb) var(--scroll-track); scrollbar-width: thin; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: var(--scroll-track); }
      *::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; }
      *::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
      *::-webkit-scrollbar-thumb:active { background: var(--accent); }
      body { margin: 0; }
      main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; text-align: center; }
      h1 { margin: 0 0 10px; font-size: clamp(25px, 5vw, 32px); font-weight: 500; letter-spacing: -0.8px; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .stage { display: grid; place-items: center; width: 100%; padding: 58px 0 44px; }
      voice-orb { --orb-size: 45px; }
      #status { min-height: 24px; margin-bottom: 24px; font-weight: 500; }
      .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
      button { font: inherit; font-size: 14px; padding: 12px 18px; min-height: 44px; border: 1px solid #44444b; border-radius: 24px; background: #232326; color: #dedee5; cursor: pointer; }
      button:hover { background: #30303a; border-color: #7f8cc7; }
      button:active { background: #3a4057; }
      button[aria-pressed="true"] { background: #30374e; color: var(--accent); border-color: #8796d2; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
      #pause { margin-top: 20px; border-color: transparent; color: var(--muted); }
      .note { margin-top: 34px; max-width: 38ch; font-size: 13px; }
      @media (max-width: 400px) { .controls { gap: 6px; } button { padding-inline: 13px; } }
      @media (forced-colors: active) { * { scrollbar-color: auto; } button[aria-pressed="true"] { border: 2px solid Highlight; } }
    </style>
    <script type="module" src="./voice-orb.js"></script>
  </head>
  <body>
    <main>
      <h1>Niebieska kulka</h1>
      <p>Podgląd animacji interfejsu głosowego</p>
      <div class="stage"><voice-orb state="idle"></voice-orb></div>
      <div id="status" role="status">Spoczynek</div>
      <div class="controls" role="group" aria-label="Testowy stan kulki">
        <button type="button" data-state="idle" aria-pressed="true">Spoczynek</button>
        <button type="button" data-state="listening" aria-pressed="false">Słuchanie</button>
        <button type="button" data-state="speaking" aria-pressed="false">Mówienie</button>
      </div>
      <button type="button" id="pause" aria-pressed="false">Wstrzymaj animację</button>
      <p class="note">Symulacja wizualna. Przyciski zmieniają animację; mikrofon pozostaje wyłączony.</p>
    </main>
    <script type="module">
      const orb = document.querySelector('voice-orb');
      const buttons = document.querySelectorAll('[data-state]');
      for (const button of buttons) {
        button.addEventListener('click', () => {
          orb.state = button.dataset.state;
          for (const item of buttons) item.setAttribute('aria-pressed', String(item === button));
          document.querySelector('#status').textContent = button.textContent;
        });
      }
      document.querySelector('#pause').addEventListener('click', (event) => {
        const paused = orb.toggleAttribute('paused');
        event.currentTarget.setAttribute('aria-pressed', String(paused));
        event.currentTarget.textContent = paused ? 'Wznów animację' : 'Wstrzymaj animację';
      });
    </script>
  </body>
</html>
